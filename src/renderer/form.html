<!DOCTYPE html>

<html>

<head>
    <title>CARD EDITOR</title>
</head>


<body>
    <h1>Add your card to database</h1>
    <!-- get id here -->
    <h3>New Card's ID: </h3>
    
    <form method="POST">

        <div id="color">
            <label for="color">Color:</label>
            <select name="color" id="color">
                <option value=   "Red">    Red</option>
                <option value="Orange"> Orange</option>
                <option value="Yellow"> Yellow</option>
                <option value= "Green">  Green</option>
                <option value=  "Cyan">   Cyan</option>
                <option value=  "Blue">   Blue</option>
                <option value="Purple"> Purple</option>
            </select>
        </div>

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" 
            minlength="1" maxlength="20" placeholder="Card Name">
        </div>
        
        <br>
        
        <div>
            <label for="mana-cost">Mana Cost:</label>
            <input type="number" id="mana-cost" name="mana-cost" placeholder="Cost of Card" value="0" min="0" max="10">
        </div>

        <br>

        <div id="card-type">
            <label for="card-type">Card Type:</label>
            <select name="card-type" id="card-type">
                <option value="minion">Minion</option>
                <option value="spell">Spell</option>
                <option value="item">Item</option>
                <option value="mana">Mana</option>
            </select>
        </div>

        <br>

        <div id="minion field">
            <label for="speed">Speed:</label>
            <input type="number" id="speed" name="speed" placeholder="tiles per turn" value="1" min="0" max="10">

            <div>
                <input type="number" id="attack" name="attack" placeholder="attack power">
                <input type="number" id="health" name="health" placeholder="health point">
            </div>
        </div>

        <div id="spell field">
            <!-- If targetable spell, which group can it target, type: damage,heal etc.,  -->
            <label for="is-targetable">Targetable?: </label>
            <input type="checkbox" name="targetable" id="targetable">

            <div id="target field">
                <label for="target-group">Target Group: </label>
                <select name="target-group" id="target-group">
                    
                    <option value="SELF">Self</option>
                    <option value="ANY_PLAYER">Any player</option>
                    <option value="ENEMY_PLAYER">Enemy player</option>

                    <option value="YOUR_MINION">Your minion</option>
                    <option value="ANY_MINION">Any minion</option>
                    <option value="ENEMY_MINION">Enemy minion</option>
                    
                    <option value="YOUR_TILE">Your tile</option>
                    <option value="ANY_TILE">Any tile</option>
                    <option value="ENEMY_TILE">Enemy tile</option>
                </select>
            </div>
        </div>

        <br>
        
        <div>
            <label for="description">Description: </label>
            <textarea id="description" name="description" rows="5" cols="70" placeholder="Description of card"></textarea>
        </div>

        <div>
            <label for="asset">Asset:</label>
            <input type="file" name="asset" id="asset" accept="image/png, image/jpeg">
        </div>
        
        <br>
        
        <button type="reset">Reset Card</button><br>
        <button type="submit">Push Card</button><br>

    </form>
    
    <button id="exit-form">Finish Process</button><br>
    

    <script>
        require("./form.js");
    </script>


</body>

</html>
